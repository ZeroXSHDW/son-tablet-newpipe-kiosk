<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #121212;
    font-family: sans-serif;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    width: 100%;
    height: 100%;
  }
  .btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px solid #333;
    color: #fff;
    text-decoration: none;
    text-align: center;
    padding: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  .btn:active {
    background-color: #555;
  }
  #btn1 { background-color: #1a237e; }
  #btn2 { background-color: #0d47a1; }
  #btn3 { background-color: #006064; }
  #btn4 { background-color: #1b5e20; }
  #btn5 { background-color: #b71c1c; }
  #btn6 { background-color: #4a148c; }
</style>
</head>
<body>
<div class="grid">
  <a id="btn1" class="btn" href="intent://#Intent;package=net.gcompris.full;end">
    <span>1. intent://#Intent;package=...;end</span>
  </a>
  <a id="btn2" class="btn" href="intent:#Intent;package=net.gcompris.full;end">
    <span>2. intent:#Intent;package=...;end</span>
  </a>
  <a id="btn3" class="btn" href="intent://#Intent;scheme=android-app;package=net.gcompris.full;end">
    <span>3. intent://#Intent;scheme=android-app;package=...;end</span>
  </a>
  <a id="btn4" class="btn" href="intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=net.gcompris.full;end">
    <span>4. intent://...MAIN...LAUNCHER;package=...;end</span>
  </a>
  <a id="btn5" class="btn" href="intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=net.gcompris.full;component=net.gcompris.full/net.gcompris.GComprisActivity;end">
    <span>5. intent://...component=...;end</span>
  </a>
  <a id="btn6" class="btn" href="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=net.gcompris.full;component=net.gcompris.full/net.gcompris.GComprisActivity;end">
    <span>6. intent:#Intent...component=...;end</span>
  </a>
</div>

<script>
  const buttons = document.querySelectorAll('.btn');
  buttons.forEach(btn => {
    btn.addEventListener('click', function(e) {
      // Turn background yellow on click to confirm tap registered
      btn.style.backgroundColor = '#ffeb3b';
      btn.style.color = '#000';
      console.log('Clicked: ' + btn.id);
    });
  });
</script>
</body>
</html>
